testConfiguration:
  services:
    catalogue:
    - expectedResponse: 200
      method: get
      operationId: listCatalogue
      testPath: /catalogue
      testParameters:
      - name: page
        in: query
        weight: null
        description: 1-based page number (defaults to 1).
        type: integer
        format: int32
        required: false
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
      - name: size
        in: query
        weight: null
        description: Number of items per page (defaults to 10).
        type: integer
        format: int32
        required: false
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: type
            values:
            - integer
          - name: min
            values:
            - '1'
          - name: max
            values:
            - '100'
      - name: tags
        in: query
        weight: null
        description: Comma-separated list of tags to filter by.
        type: string
        required: false
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
      - name: sort
        in: query
        weight: null
        description: Field to sort by (defaults to id).
        type: string
        required: false
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
    - expectedResponse: 200
      method: get
      operationId: getCatalogueSize
      testPath: /catalogue/size
      testParameters:
      - name: tags
        in: query
        weight: null
        description: Comma-separated list of tags to filter the count by.
        type: string
        required: false
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
    - expectedResponse: 200
      method: get
      operationId: getCatalogueItem
      testPath: /catalogue/{id}
      testParameters:
      - name: id
        in: path
        weight: null
        description: Catalogue item id (UUID-style string).
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
    - expectedResponse: 200
      method: get
      operationId: listTags
      testPath: /tags
      testParameters: null
    cart:
    - expectedResponse: 200
      method: get
      operationId: getCart
      testPath: /cart
      testParameters: null
    order:
    - expectedResponse: 200
      method: get
      operationId: listOrders
      testPath: /orders
      testParameters: null
    user:
    - expectedResponse: 200
      method: get
      operationId: listAddresses
      testPath: /addresses
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: listCards
      testPath: /cards
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: getCard
      testPath: /cards/{id}
      testParameters:
      - name: id
        in: path
        weight: null
        description: Card id (UUID-style string).
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
    - expectedResponse: 200
      method: get
      operationId: listCustomers
      testPath: /customers
      testParameters: null
    - expectedResponse: 200
      method: get
      operationId: getCustomer
      testPath: /customers/{id}
      testParameters:
      - name: id
        in: path
        weight: null
        description: Customer id (UUID-style string).
        type: string
        required: true
        generators:
        - type: LLMParameterGenerator
          genParameters:
          - name: length
            values:
            - '10'
