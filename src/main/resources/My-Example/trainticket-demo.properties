# Train-ticket Microservice System Testing Configuration
# Updated for testing two-stage LLM + semantic expansion approach

# API name
api=TrainTicket

# CONFIGURATION PARAMETERS

# Test case generator - MST for multi-service testing
generator=MST

# Number of test cases to be generated per operation on each iteration
# Increased to better see the variant generation
testsperoperation=100

# OAS specification - path to merged OpenAPI spec
oas.path=src/main/resources/My-Example/trainticket/merged_openapi_spec 1.yaml

# Test configuration file - generated by MicroserviceConfBuilderMain
conf.path=src/main/resources/My-Example/trainticket/real-system-conf.yaml

# Directory where the test cases will be generated (temporary simplified path for testing)
test.target.dir=src/test/java

# Package name (must be valid Java identifier - no hyphens)
test.target.package=trainticket

# Experiment name (for naming related folders and files)
experiment.name=trainticket_twostage_test

# Test class name prefix
testclass.name=TrainTicketTwoStageTest

# Execute the test cases (disabled for multi-service test generation)
experiment.execute=true

# Generate Allure reports (enabled for improved test reporting)
allure.report=true

# Check test cases with OAS validator (disabled to prevent validation delays)
testcases.check=false

# Measure input coverage (disabled for MST mode)
coverage.input=false

# Measure output coverage (disabled for MST mode)
coverage.output=false

# Enable CSV statistics 
stats.csv=true

# Delete previous results before starting
deletepreviousresults=true

# Maximum number of test cases to be generated (-1 for infinite)
# Set to -1 to allow the natural stopping point after one iteration
numtotaltestcases=-1

# Maximum number of iterations (set to 1 for single generation)
max.iterations=1

# Optional delay between each iteration (in seconds, -1 for no delay)
delay=-1

# Ratio of faulty test cases to be generated (negative testing)
faulty.ratio=0.8

# Faulty parameter selection strategy
# true (default): Round-robin - each faulty test has exactly ONE faulty parameter, cycling through all parameters
# false: Random - randomly select one or more parameters to make faulty in each test case
faulty.round-robin=true

# CONFIGURATION SETTINGS FOR CONSTRAINT-BASED TESTING

# Ratio of faulty test cases to be generated due to broken dependencies
faulty.dependency.ratio=0.05

# Number of test cases after which new test data will be loaded
reloadinputdataevery=50

# Max number of data values for each parameter
inputdatamaxvalues=500

# TRAIN-TICKET SPECIFIC SETTINGS

# Base URL for the Train-ticket system
base.url=http://129.62.148.112:32677

# HTTP timeout settings for REST Assured test execution (milliseconds)
# Prevents tests from hanging when server doesn't respond (e.g., oversized URL payloads)
http.connect.timeout.ms=10000
http.socket.timeout.ms=30000

# Authentication settings
auth.admin.username=admin
auth.admin.password=222222
auth.user.username=fdse_microservice
auth.user.password=111111

# LLM CONFIGURATION FOR TWO-STAGE APPROACH
# Enable LLM for parameter generation
llm.enabled=true

# Model selection: local, gemini, or ollama
# 'local' covers any OpenAI-compatible chat-completions endpoint, including
# DeepSeek and OpenAI itself. The bearer token is read from the env var
# referenced in llm.local.api.key (see below).
llm.model.type=local

# DeepSeek (OpenAI-compatible). Endpoint accepts standard OpenAI chat-
# completions payloads; LLMService adds Authorization: Bearer <key> when
# llm.local.api.key resolves to a non-empty value.
llm.local.enabled=true
llm.local.url=https://api.deepseek.com/v1/chat/completions
llm.local.model=deepseek-chat
llm.local.api.key=${DEEPSEEK_API_KEY}

# Gemini API settings (disabled while DeepSeek is active)
llm.gemini.enabled=false
llm.gemini.api.key=AIzaSyANJa0k_Ap8JROFtAh7BbxQo3XrVGHLR-c
llm.gemini.model=gemini-2.0-flash-exp
llm.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Ollama API settings (disabled while DeepSeek is active; flip
# llm.model.type back to 'ollama' and these two booleans to switch.)
llm.ollama.enabled=false
llm.ollama.url=http://localhost:11434
llm.ollama.model=qwen2.5-coder:14b

# Rate limiting — DeepSeek can return 429 under load, so retries help.
llm.rate.limit.retry.enabled=true
llm.rate.limit.max.retries=3

# LLM COMMUNICATION LOGGING CONFIGURATION
# Enable detailed logging of all LLM communications (requests and responses)
llm.communication.logging.enabled=true

# Directory where LLM communication logs will be stored
llm.communication.logging.dir=logs/llm-communications

# Log file naming pattern (timestamp will be added automatically)
llm.communication.logging.file.prefix=llm-communication

# Include response time measurements in logs
llm.communication.logging.include.response.time=true

# Include request/response content in logs (set to false for privacy)
llm.communication.logging.include.content=true

# Include model-specific metadata (model name, temperature, etc.)
llm.communication.logging.include.metadata=true

# Log level for LLM communications (DEBUG, INFO, WARN, ERROR)
llm.communication.logging.level=INFO

# Maximum content length to log (truncate longer content, -1 for no limit)
llm.communication.logging.max.content.length=-1

# JAEGER TRACE FETCHING CONFIGURATION
# ===================================
# Enable Jaeger trace fetching for error analysis
jaeger.enabled=true

# Jaeger base URL (API endpoint for fetching traces)
# This is where the system will query for distributed traces
jaeger.base.url=http://129.62.148.112:30005/jaeger/ui/api

# Jaeger lookback period for trace queries (e.g., "10m", "1h", "30m")
# Used when time-based queries fail
jaeger.lookback=10m

# LLM RESPONSE VALIDATION CONFIGURATION
# =====================================
# Enable LLM-powered validation of 2XX responses to detect "soft errors"
# (APIs that return 200 OK but include error messages in response body)
llm.response.validation.enabled=true

# Only validate 2XX responses (200-299) - faster execution
# If false, validates all responses regardless of status code
llm.response.validation.only.2xx=true

# Include detailed RCA (Root Cause Analysis) from LLM in Allure reports
llm.response.validation.include.rca=true

# SOFT ERROR RULE CACHE
# =====================
# Cache LLM-generated validation rules per API to avoid redundant LLM calls.
# On the first 2XX response for each API, the LLM generates a reusable rule.
# Subsequent responses are evaluated programmatically using the cached rule.
soft.error.cache.enabled=true
soft.error.cache.path=target/soft-error-rule-cache.json

# SYSTEM RESOURCE MONITORING CONFIGURATION (LOCAL & OLLAMA ONLY)
# ==============================================================
# Enable system resource monitoring during local LLM communications
# Note: Resource usage is captured during LLM generation and included in communication logs
# Only monitors LOCAL and OLLAMA models, not online APIs like Gemini
llm.resource.monitoring.enabled=true

# Monitoring interval in milliseconds (how often to sample CPU/Memory during generation)
# Recommended values: 250ms (detailed), 500ms (balanced), 1000ms (light)
llm.resource.monitoring.interval.ms=500

# Include detailed memory information (heap, non-heap memory usage)
llm.resource.monitoring.include.detailed.memory=true

# Include CPU usage monitoring
llm.resource.monitoring.include.cpu=true

# Two-stage parameter generation settings
llm.seed.count=5

# Execute test cases after generation (enabled to generate Allure reports)
executeTestCases=true

# SMART INPUT FETCHING SYSTEM CONFIGURATION
# Enable intelligent input fetching from existing APIs
smart.input.fetch.enabled=true

# Percentage of inputs to fetch from smart sources vs traditional LLM generation (0.0-1.0)
smart.input.fetch.percentage=0.3

# Path to the input fetch registry file (stores learned API mappings)
smart.input.fetch.registry.path=src/main/resources/My-Example/trainticket/input-fetch-registry.yaml

# Path to the OpenAPI specification file for endpoint discovery
smart.input.fetch.openapi.spec.path=src/main/resources/My-Example/trainticket/merged_openapi_spec 1.yaml

# Enable LLM-powered API discovery and parameter matching
smart.input.fetch.llm.discovery.enabled=true

# Maximum number of candidate APIs to consider per parameter
smart.input.fetch.max.candidates=5

# Enable dependency chain resolution for complex parameter relationships
smart.input.fetch.dependency.resolution.enabled=true

# Timeout for API discovery requests (milliseconds)
smart.input.fetch.discovery.timeout.ms=5000

# Enable caching of fetched values to improve performance
smart.input.fetch.cache.enabled=true

# Cache TTL in seconds
smart.input.fetch.cache.ttl.seconds=300

# Priority configuration for different discovery methods
smart.input.fetch.default.priority=5
smart.input.fetch.pattern.discovery.priority=5
smart.input.fetch.llm.discovery.priority=7

# HTTP configuration for API requests
smart.input.fetch.http.content.type=application/json
smart.input.fetch.http.success.code=200
smart.input.fetch.schema.discovery.timeout.ms=3000

# DEBUGGING AND LOGGING SETTINGS
# Enable detailed logging for two-stage approach
logging.level.root=INFO
logging.level.es.us.isa.restest.generators.MultiServiceTestCaseGenerator=DEBUG
logging.level.es.us.isa.restest.generators.AiDrivenLLMGenerator=DEBUG
logging.level.es.us.isa.restest.workflow.TraceWorkflowExtractor=DEBUG

# Log to file instead of console
logToFile=true
data.log.dir=logs
data.log.file=trainticket_test_execution

# Trace directory/file for MST (JSON/JSONL) is defined in code: TestGenerationAndExecution.TraceFile
# (trace.file.path below is not read; kept for documentation only)
# trace.file.path=src/main/resources/My-Example/trainticket/traces/

# Test variant generation (increased to match testsperoperation)
test.variants.per.scenario=10

# MST step generation control
# If true, generator keeps only the first business step per scenario (writer still logs in as step 0)
mst.generate.only.first.step=true

# Session-based heuristic trace merging
# Maximum time gap (microseconds) between consecutive traces from the same client IP
# for them to be merged into a single multi-root scenario. Default: 60000000 (60 seconds).
trace.merge.max.session.gap.micros=60000000
# Maximum number of root steps allowed in one merged scenario (safety cap).
trace.merge.max.roots.per.scenario=10

# ROOT API REGISTRY CONFIGURATION
# Enable and configure Root API Registry for tracking unique root APIs and their microservice interaction trees
# The registry prevents duplicate root APIs and maintains tree structures for each root API
root.api.registry.enabled=true

# Path where the Root API Registry JSON file will be stored
# This file contains all discovered root APIs with their complete microservice interaction trees
root.api.registry.path=src/main/resources/My-Example/trainticket/root-api-registry.json

# Enable detailed logging for root API registry operations
root.api.registry.debug.logging=false

# Detailed output for debugging
verbose.parameter.generation=true
verbose.test.case.creation=true

# NEGATIVE TEST INPUT GENERATION CONFIGURATION
# =============================================
# Mode for generating invalid inputs for negative test cases.
# Options:
#   - smart (default)  — LLM only for REGEX_MISMATCH + SEMANTIC_MISMATCH (where domain
#                        context genuinely helps); static/schema-derived payloads for
#                        NULL, EMPTY, OVERFLOW, SPECIAL_CHARACTERS, TYPE_MISMATCH,
#                        BOUNDARY_VIOLATION.  Cuts LLM calls per parameter from ~6 to ~2.
#   - llm              — LLM for all 6 contextual fault types (legacy behavior; retained
#                        for research / ablation studies; much slower).
#   - hardcode         — Fully deterministic; zero LLM calls; fastest and reproducible.
#
# Rationale: categories like OVERFLOW, NULL, EMPTY, SPECIAL_CHARACTERS, and TYPE_MISMATCH
# are universal or schema-deterministic — every major fuzzing tool (RESTler, EvoMaster,
# Schemathesis, OWASP ZAP, Burp) uses static dictionaries for them.  Only REGEX inversion
# and SEMANTIC mismatch genuinely benefit from LLM context.
#
# Note: For array parameters, all modes generate:
#   1. Invalid array structures (null array, empty array, wrong type)
#   2. Invalid values INSIDE the array (null elements, wrong type elements)
negative.input.generation.mode=smart

# FAULT DETECTION TRACKING CONFIGURATION
# Enable tracking of injected faults detected during test execution
fault.detection.enabled=true

# Path to the injected faults JSON registry file
fault.detection.injected.faults.path=src/main/resources/My-Example/trainticket/injectedFaults/injected-faults.json

# Directory where fault detection reports will be saved
fault.detection.report.dir=logs/fault-detection-reports

# TEST CASE ENHANCER CONFIGURATION
# =================================
# The Test Case Enhancer analyzes failed test cases and uses LLM to suggest
# improved parameter values based on the API error responses.

# Enable/disable the test case enhancer
# When enabled, failed tests will be analyzed and re-executed with improved inputs
test.enhancer.enabled=true

# Number of enhancement rounds to perform
# Each round: execute tests -> collect failures -> enhance with LLM -> regenerate tests
# Default is 1 (one enhancement round, meaning tests run twice: original + enhanced)
test.enhancer.rounds=1

# Skip enhancement for 5xx server errors
# 5xx errors indicate internal server bugs, not input validation issues
# These cannot be "fixed" by changing input values, so they are skipped
test.enhancer.skip.5xx=true

# STATUS CODE EXPLORATION CONFIGURATION
# =====================================
# The Status Code Exploration enhancer creates new test cases to explore
# untriggered HTTP status codes for each API operation.
# 
# Key features:
# - Runs AFTER first execution (uses actual results to inform discovery)
# - LLM discovers ALL possible status codes for each API
# - Creates NEW tests (doesn't modify originals)
# - Uses round-robin to avoid targeting same code twice per round
# - Works alongside the test enhancer (original tests still get enhanced)

# Enable/disable status code exploration
# When enabled, the enhancer will create exploration tests targeting untriggered status codes
status.code.exploration.enabled=true

# Maximum exploration tests to create per original test per round
# Each original test can spawn up to this many exploration tests
status.code.exploration.max.per.test=3

# Maximum exploration tests to create per enhancer round (total across all tests)
# Prevents test explosion - prioritizes APIs with lowest coverage
status.code.exploration.max.per.round=20

# AUTH MANIPULATION SETTINGS FOR 401/403 EXPLORATION
# ===================================================
# Settings for exploring authentication-related status codes

# Invalid token to use for 401 Unauthorized testing
status.code.auth.invalid.token=INVALID_TOKEN_12345

# Expired JWT token (example - replace with actual expired token for your system)
status.code.auth.expired.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkV4cGlyZWQiLCJleHAiOjF9.expired

# Guest/anonymous user credentials for 403 Forbidden testing
status.code.auth.guest.user=guest
status.code.auth.guest.password=guest

# Restricted user credentials (user with limited permissions) for 403 testing
status.code.auth.restricted.user=restricted_user
status.code.auth.restricted.password=restricted_pass